<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1f22" />
  <title>KankaChat — Sohbet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235865f2'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EK%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login" class="login">
    <div class="login-card">
      <div class="login-logo">🎧</div>
      <h1>KankaChat</h1>
      <p>Hesabınla gir, kankalarınla takıl.<br>Kayıt ol, kullanıcı adın + şifrenle gel. 🔐</p>
      <div class="mode-row">
        <button id="modeM">📱 Mobil</button>
        <button id="modeA">✨ Oto</button>
        <button id="modeP">🖥️ PC</button>
      </div>
      <div class="tabs">
        <button id="tabLogin" class="tab sel">🔑 Giriş Yap</button>
        <button id="tabReg" class="tab">📝 Kayıt Ol</button>
      </div>
      <div id="loginForm">
        <input id="loginName" type="text" maxlength="24" placeholder="Kullanıcı adın" autocomplete="username" />
        <input id="loginPass" type="password" placeholder="Şifren" autocomplete="current-password" />
        <button id="loginBtn" class="btn-primary">Giriş Yap 🚀</button>
        <button id="forgotBtn" class="link-btn">Şifremi unuttum 😢</button>
      </div>
      <div id="regForm" class="hidden">
        <input id="regName" type="text" maxlength="24" placeholder="Kullanıcı adın (2-24)" />
        <input id="regMail" type="email" placeholder="Mail adresin 📧" />
        <input id="regPass" type="password" placeholder="Şifre (en az 6)" />
        <input id="regPass2" type="password" placeholder="Şifre (tekrar)" />
        <div id="colorRow" class="color-row"></div>
        <button id="regBtn" class="btn-primary">Kayıt Ol 🎉</button>
      </div>
      <input id="loginInvite" type="text" maxlength="6" placeholder="Davet kodu (gerekirse)" autocomplete="off" style="margin-top:8px;text-transform:uppercase" />
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- ANA UYGULAMA -->
  <div id="app" class="app hidden">

    <!-- Mobil üst bar -->
    <header id="topbar" class="topbar">
      <button id="menuBtn" class="icon-btn" title="Kanallar">☰</button>
      <div id="topTitle" class="top-title">#genel</div>
      <button id="membersBtn" class="icon-btn" title="Üyeler">👥</button>
    </header>

    <!-- Sol panel: kanallar -->
    <aside id="sidebar" class="sidebar">
      <div class="server-head">
        <span class="server-name">🎧 KankaChat</span>
        <span style="display:flex;align-items:center;gap:6px">
          <button id="ownerBtn" class="icon-btn hidden" title="Sunucu ayarları (sahip)">⚙️</button>
          <span id="onlineBadge" class="online-badge">0 çevrimiçi</span>
        </span>
      </div>
      <div id="ownerPop" class="pop-panel hidden">
        <div class="pop-title">👑 Sahip Ayarları</div>
        <label class="inv-row"><input type="checkbox" id="invOn" /> Davet kodu zorunlu olsun 🔐</label>
        <div class="inv-row">Kod: <b id="invCode">—</b>
          <button id="invCopy" class="icon-btn" title="Kopyala">📋</button>
          <button id="invNew" class="icon-btn" title="Yeni kod">🔄</button>
        </div>
      </div>
      <nav id="channelList" class="channel-list"></nav>
      <div id="voicePanel" class="voice-panel hidden">
        <div class="voice-info">
          <span class="voice-dot"></span>
          <div>
            <div class="voice-title">Ses bağlantısı kuruldu</div>
            <div id="voiceChanName" class="voice-sub">Oda</div>
          </div>
        </div>
        <div class="voice-actions">
          <button id="muteBtn" class="icon-btn" title="Mikrofon aç/kapat">🎙️</button>
          <button id="micBtn" class="icon-btn" title="Mikrofon seç">🎚️</button>
          <button id="screenBtn" class="icon-btn" title="Ekranını paylaş">🖥️</button>
          <button id="soundBtn" class="icon-btn" title="Soundboard">🎵</button>
          <button id="voiceLeaveBtn" class="icon-btn danger" title="Odadan çık">📞</button>
        </div>
        <div id="soundPop" class="pop-panel sound-pop hidden"></div>
      </div>
      <div class="me-bar">
        <div style="position:relative">
          <div id="meAvatar" class="avatar"></div>
          <span id="meDot" class="p-dot online" title="Durumunu değiştir"></span>
        </div>
        <div id="meName" class="me-name">Ben</div>
        <button id="uiBtn" class="icon-btn" title="Görünüm / tema">🎨</button>
        <button id="musicBtn" class="icon-btn" title="Arka plan müziği (YouTube)">🎧</button>
        <button id="logoutBtn" class="icon-btn" title="Çıkış yap">⏻</button>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <!-- Orta: sohbet -->
    <main class="chat">
      <div id="watchPanel" class="watch-panel hidden">
        <div class="watch-controls">
          <input id="watchInp" placeholder="YouTube linki yapıştır…" />
          <button id="watchPlay" class="btn-small">▶ Başlat</button>
          <button id="watchPause" class="btn-small">⏸ Herkes</button>
          <button id="watchStop" class="btn-small">⏹</button>
          <span id="watchNow" class="watch-now"></span>
        </div>
        <div id="watchPlayer" class="watch-player"></div>
      </div>
      <div class="channel-header">
        <div class="channel-title"><span class="hash">#</span><span id="chName">genel</span></div>
        <div id="chTopic" class="channel-topic"></div>
        <span class="header-actions">
          <input id="searchInp" class="search-inp hidden" placeholder="mesajlarda ara…" />
          <button id="searchBtn" class="icon-btn" title="Mesajlarda ara">🔍</button>
          <button id="pinBtn" class="icon-btn" title="Sabitlenmiş mesajlar">📌</button>
          <button id="helpBtn" class="icon-btn" title="Komutlar & yardım">❓</button>
          <button id="lockBtn" class="icon-btn hidden" title="Kanalı kilitle/aç">🔓</button>
          <button id="renBtn" class="icon-btn hidden" title="Kanalı yeniden adlandır">✏️</button>
          <button id="delBtn" class="icon-btn hidden" title="Kanalı sil">🗑️</button>
          <button id="bellBtn" class="icon-btn" title="Bildirimleri aç">🔔</button>
        </span>
      </div>
      <div id="messages" class="messages"></div>
      <div id="typingRow" class="typing-row"></div>
      <div id="lockNote" class="lock-note hidden">🔒 Bu kanal kilitli — sadece yönetici yazabilir</div>
      <div id="netBanner" class="net-banner hidden">⚠️ Bağlantı koptu, yeniden bağlanılıyor…</div>
      <div id="imgPreview" class="img-preview hidden">
        <img id="imgPreviewImg" alt="önizleme" />
        <span id="imgPreviewLabel" class="img-label"></span>
        <button id="imgRemoveBtn" class="icon-btn">✕</button>
      </div>
      <div class="composer">
        <button id="attachBtn" class="icon-btn" title="Resim gönder">➕</button>
        <input type="file" id="fileInput" accept="image/*,video/*,audio/*,.pdf,.zip,.rar,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx" hidden />
        <textarea id="input" rows="1" maxlength="2000" placeholder="#genel kanalına yaz…"></textarea>
        <button id="emojiBtn" class="icon-btn" title="Emoji">😀</button>
        <button id="sovBtn" class="icon-btn" title="Coin şovları">🎆</button>
        <button id="sendBtn" class="send-btn" title="Gönder">➤</button>
        <div id="emojiPop" class="emoji-pop hidden"></div>
        <div id="sovPop" class="sov-pop hidden"></div>
      </div>
    </main>

    <!-- Sağ panel: üyeler -->
    <aside id="members" class="members">
      <div class="members-head">ÜYELER</div>
      <div id="memberList" class="member-list"></div>
    </aside>

  </div>

  <!-- ekran paylaşımı penceresi -->
  <div id="screenOverlay" class="screen-overlay hidden">
    <div class="screen-head">
      <span id="screenTitle">Ekran paylaşımı</span>
      <span style="display:flex;gap:2px">
        <button id="screenFull" class="icon-btn" title="Tam ekran">⛶</button>
        <button id="screenClose" class="icon-btn" title="Pencereyi gizle">✕</button>
      </span>
    </div>
    <video id="screenVideo" autoplay playsinline muted></video>
    <button id="screenStopBtn" class="btn-stop hidden">⏹ Paylaşımı Durdur</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
