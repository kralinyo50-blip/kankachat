<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1f22" />
  <title>KankaChat — Sohbet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235865f2'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EK%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="login" class="login">
    <div class="login-card">
      <div class="login-logo">🎧</div>
      <h1>KankaChat</h1>
      <p>Arkadaşlarınla yazış, sesli odalarda konuş.<br>Hemen bir takma ad seç ve katıl.</p>
      <input id="loginName" type="text" maxlength="24" placeholder="Takma adın..." autocomplete="off" />
      <div id="colorRow" class="color-row"></div>
      <button id="loginBtn" class="btn-primary">Sohbete Katıl 🚀</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- ANA UYGULAMA -->
  <div id="app" class="app hidden">

    <!-- Mobil üst bar -->
    <header id="topbar" class="topbar">
      <button id="menuBtn" class="icon-btn" title="Kanallar">☰</button>
      <div id="topTitle" class="top-title">#genel</div>
      <button id="membersBtn" class="icon-btn" title="Üyeler">👥</button>
    </header>

    <!-- Sol panel: kanallar -->
    <aside id="sidebar" class="sidebar">
      <div class="server-head">
        <span class="server-name">🎧 KankaChat</span>
        <span id="onlineBadge" class="online-badge">0 çevrimiçi</span>
      </div>
      <nav id="channelList" class="channel-list"></nav>
      <div id="voicePanel" class="voice-panel hidden">
        <div class="voice-info">
          <span class="voice-dot"></span>
          <div>
            <div class="voice-title">Ses bağlantısı kuruldu</div>
            <div id="voiceChanName" class="voice-sub">Oda</div>
          </div>
        </div>
        <div class="voice-actions">
          <button id="muteBtn" class="icon-btn" title="Mikrofon aç/kapat">🎙️</button>
          <button id="screenBtn" class="icon-btn" title="Ekranını paylaş">🖥️</button>
          <button id="voiceLeaveBtn" class="icon-btn danger" title="Odadan çık">📞</button>
        </div>
      </div>
      <div class="me-bar">
        <div id="meAvatar" class="avatar"></div>
        <div id="meName" class="me-name">Ben</div>
        <button id="logoutBtn" class="icon-btn" title="Çıkış yap">⏻</button>
      </div>
    </aside>
    <div id="backdrop" class="backdrop"></div>

    <!-- Orta: sohbet -->
    <main class="chat">
      <div class="channel-header">
        <div class="channel-title"><span class="hash">#</span><span id="chName">genel</span></div>
        <div id="chTopic" class="channel-topic"></div>
      </div>
      <div id="messages" class="messages"></div>
      <div id="typingRow" class="typing-row"></div>
      <div id="netBanner" class="net-banner hidden">⚠️ Bağlantı koptu, yeniden bağlanılıyor…</div>
      <div id="imgPreview" class="img-preview hidden">
        <img id="imgPreviewImg" alt="önizleme" />
        <button id="imgRemoveBtn" class="icon-btn">✕</button>
      </div>
      <div class="composer">
        <button id="attachBtn" class="icon-btn" title="Resim gönder">➕</button>
        <input type="file" id="fileInput" accept="image/*" hidden />
        <textarea id="input" rows="1" maxlength="2000" placeholder="#genel kanalına yaz…"></textarea>
        <button id="emojiBtn" class="icon-btn" title="Emoji">😀</button>
        <button id="sendBtn" class="send-btn" title="Gönder">➤</button>
        <div id="emojiPop" class="emoji-pop hidden"></div>
      </div>
    </main>

    <!-- Sağ panel: üyeler -->
    <aside id="members" class="members">
      <div class="members-head">ÜYELER</div>
      <div id="memberList" class="member-list"></div>
    </aside>

  </div>

  <!-- ekran paylaşımı penceresi -->
  <div id="screenOverlay" class="screen-overlay hidden">
    <div class="screen-head">
      <span id="screenTitle">Ekran paylaşımı</span>
      <button id="screenClose" class="icon-btn" title="Pencereyi gizle">✕</button>
    </div>
    <video id="screenVideo" autoplay playsinline muted></video>
    <button id="screenStopBtn" class="btn-stop hidden">⏹ Paylaşımı Durdur</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
